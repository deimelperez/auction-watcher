name: auction-results

on:
  schedule:
    - cron: "0 22 * * 1-5"  # weekdays, 6 PM Miami (EDT); 5 PM in winter. After the day's sales close.
  workflow_dispatch:        # "Run workflow" button: collects today's results

permissions:
  contents: write           # lets the job commit results.csv back

concurrency:
  group: auction-watcher    # same group as the watcher, so they never push at the same time
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect today's sale results
        env:
          TZ: America/New_York          # "today" = Miami date
          BASE_URL: "https://www.miamidade.realforeclose.com,https://broward.realtaxdeed.com"
          AUCTION_TYPES: TAXDEED
          RESULTS_NOTIFY: "1"           # short summary of sold items; "0" = just save the data
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python auction_watcher.py --results
      - name: Save results
        run: |
          git config user.name "auction-watcher"
          git config user.email "actions@users.noreply.github.com"
          [ -f results.csv ] || exit 0   # no sale today and nothing collected yet
          git add results.csv
          git diff --cached --quiet || (git commit -m "add sale results" && git pull --rebase && git push)
