name: auction-results

on:
  schedule:
    - cron: "43 22 * * 1-5"  # weekdays, 5:43 PM Miami in winter (6:43 in summer), after the sales close
  workflow_dispatch:        # "Run workflow" button
    inputs:
      since:
        description: "Collect every sale day from this date (MM/DD/YYYY). Empty = last 7 days."
        required: false
        default: ""

permissions:
  contents: write           # lets the job commit results.csv back

concurrency:
  group: auction-watcher    # same group as the watcher, so they never push at the same time
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect today's sale results
        env:
          TZ: America/New_York          # "today" = Miami date
          BASE_URL: "https://www.miamidade.realforeclose.com,https://broward.realtaxdeed.com"
          AUCTION_TYPES: TAXDEED
          RESULTS_NOTIFY: "0"           # just save the data; results go in the Saturday report
          RESULTS_DAYS_BACK: "7"        # re-check this many days back, so a missed run is caught up
          SINCE: ${{ github.event.inputs.since }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SINCE" ]; then python auction_watcher.py --results --since "$SINCE"
          else python auction_watcher.py --results; fi
      - name: Save results
        run: |
          git config user.name "auction-watcher"
          git config user.email "actions@users.noreply.github.com"
          [ -f results.csv ] || exit 0   # no sale today and nothing collected yet
          git add results.csv
          git diff --cached --quiet || (git commit -m "add sale results" && git pull --rebase && git push)
