name: auction-watcher

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 8 AM Miami (EDT); 7 AM in winter
  workflow_dispatch:        # "Run workflow" button for manual tests

permissions:
  contents: write           # lets the job commit seen.json back

concurrency:
  group: auction-watcher    # never run at the same time as the sync job (both edit seen.json)
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run watcher
        env:
          # comma-separated sites as URL|AUCT_TYPE|REPORT_ID (2 = tax deed; REPORT_ID from the quick-search page URL)
          BASE_URL: "https://www.miamidade.realforeclose.com|2|33,https://broward.realtaxdeed.com|2|33"
          AUCTION_TYPES: TAXDEED
          MAX_BID: "25000"
          ZIPS: ""
          DAYS_AHEAD: "45"
          REMIND_DAYS: "7,1"            # reminders this many days before each sale
          LAND_USE_KEYWORDS: "VACANT+RESIDENTIAL"   # + means AND, comma means OR; empty = any
          EXCLUDE_LAND_USE: "CONDOMINIUM,CONDO"   # never alert on these land uses
          MIN_LOT_SQFT: "5000"          # smallest lot to alert on; 0 = no minimum
          COMP_RADIUS_FT: "2640"        # comparable sales within half a mile (doubles if too few)
          COMP_YEARS: "3"               # sales from the last 3 years
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python auction_watcher.py
      - name: Save seen list
        run: |
          git config user.name "auction-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git pull --rebase && git push)
