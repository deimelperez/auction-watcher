name: auction-watcher

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 8 AM Miami (EDT); 7 AM in winter
  workflow_dispatch:        # "Run workflow" button for manual tests

permissions:
  contents: write           # lets the job commit seen.json back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run watcher
        env:
          BASE_URL: https://miamidade.realtaxdeed.com
          AJAX_URL_TEMPLATE: ${{ secrets.AJAX_URL_TEMPLATE }}
          AUCTION_TYPES: TAXDEED
          MAX_BID: "25000"
          ZIPS: ""
          DAYS_AHEAD: "45"
          LAND_USE_KEYWORDS: "VACANT"   # empty = alert on any land use
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python auction_watcher.py
      - name: Save seen list
        run: |
          git config user.name "auction-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
